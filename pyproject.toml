[project]
name = "amazon-temu-selection-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "psutil>=6.0",
  "openai>=1.0",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "xlsxwriter>=3.2",
  "websocket-client==1.9.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
