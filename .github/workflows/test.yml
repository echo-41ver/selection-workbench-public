name: Offline tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps -e ".[test]"
      - run: npm ci
      - run: npx playwright install chromium
      - run: python -m pytest -q
        env:
          PYTHONUTF8: '1'
          DEEPSEEK_API_KEY: ''
      - run: npm run check
      - run: npm test
